[project]
name = "baton-cluster"
version = "0.1.0"
description = "LAN-distributed LLM inference. One model, many laptops, one relay."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "torch",
    "numpy",
    "safetensors",
    "zeroconf",
    "httpx",
    "psutil",
    "typer",
    # Any laptop can host, so every install carries the head's parts (BAT-41).
    "fastapi",
    "uvicorn",
    "websockets",
    "transformers",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/hemalbadola/baton"
Source = "https://github.com/hemalbadola/baton"

[project.scripts]
baton = "baton.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["baton"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
